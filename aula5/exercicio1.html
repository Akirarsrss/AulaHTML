<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body
        {
            background-color: snow;
        }

        h1
        {
            background-color: midnightblue;
            color: cornflowerblue;
            text-align: center;
            padding: 20px;
        }

        h3
        {
            color: midnightblue;
        }

        table, th, td
        {
            border: 1px solid midnightblue;
            border-collapse: collapse;
            padding: 5px;
            color: midnightblue;
        }



    </style>

</head>
<body>

    <table>

        </tr>

        <tr>

            <td>Cifra</td>
        </tr>

        <tr>
            <td rowspan="3">Chico Buarque</td>
            <td>A Banda</td>
            <td>X</td>
            <td>--</td>
        </tr>

        <tr>
            <td>Beatriz</td>

            <td>X</td>
        </tr>

        <tr>
            <td>Choro Bandido</td>

        </tr>

    </table>
    
</body>
</html>
